<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Glass Clock</title>

<style>
html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

/* BACKGROUND */
.bg {
    position: absolute;
    width: 100%;
    height: 100%;
    background: url("https://i.imgur.com/c8bWzJr.jpeg") center/cover no-repeat;
    transform: scale(1.05);
}

/* DARK OVERLAY */
.dim {
    position: absolute;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.35);
}

/* CENTER */
.center {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
}

/* DATE (BIGGER NOW) */
.date {
    font-size: 44px;
    font-weight: 600;
    color: rgba(255,255,255,0.9);
    letter-spacing: 2px;
    margin-bottom: 18px;
    text-shadow: 0 0 25px rgba(255,255,255,0.25);
}

/* TIME ROW */
.time-row {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 22px;
}

/* CLOCK (BIGGER) */
.clock {
    font-size: 220px;
    font-weight: 900;
    letter-spacing: 5px;

    color: rgba(255,255,255,0.95);

    -webkit-text-stroke: 2px rgba(255,255,255,0.45);

    text-shadow:
        0 0 20px rgba(255,255,255,0.55),
        0 0 50px rgba(255,255,255,0.25);
}

/* AM/PM (SCALED UP TOO) */
.ampm {
    font-size: 60px;
    font-weight: 700;
    color: rgba(255,255,255,0.8);
    text-shadow: 0 0 20px rgba(255,255,255,0.25);
}

/* LIGHT OVERLAY */
.overlay {
    position: absolute;
    width: 100%;
    height: 100%;
    pointer-events: none;
    opacity: 0.2;
    background: radial-gradient(circle at 50% 50%,
        rgba(255,255,255,0.12),
        transparent 60%);
    animation: float 6s infinite ease-in-out;
}

@keyframes float {
    0%   { transform: translate(0px, 0px); }
    50%  { transform: translate(10px, -10px); }
    100% { transform: translate(0px, 0px); }
}
</style>
</head>

<body>

<div class="bg"></div>
<div class="dim"></div>
<div class="overlay"></div>

<div class="center">

    <div id="date" class="date">Loading...</div>

    <div class="time-row">
        <div id="clock" class="clock">00:00:00</div>
        <div id="ampm" class="ampm">AM</div>
    </div>

</div>

<script>
function updateClock(){

    const now = new Date();

    const options = {
        weekday: 'long',
        month: 'long',
        day: 'numeric'
    };

    document.getElementById("date").innerText =
        now.toLocaleDateString(undefined, options);

    let h = now.getHours();
    const m = String(now.getMinutes()).padStart(2,'0');
    const s = String(now.getSeconds()).padStart(2,'0');

    const ampm = h >= 12 ? "PM" : "AM";

    h = h % 12 || 12;

    document.getElementById("clock").innerText =
        `${String(h).padStart(2,'0')}:${m}:${s}`;

    document.getElementById("ampm").innerText = ampm;
}

setInterval(updateClock, 1000);
updateClock();
</script>

</body>
</html>
